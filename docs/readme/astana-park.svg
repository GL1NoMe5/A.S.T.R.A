  <text x="640" y="236" text-anchor="middle" fill="#e4e9d9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" letter-spacing="2" opacity="0.88">ASTRA · ГОРОДСКАЯ СРЕДА, ДЕРЕВЬЯ И ТЕНЬ ДЛЯ АСТАНЫ</text>
