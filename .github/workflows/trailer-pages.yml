name: Publish promo trailer

on:
  push:
    branches: [main]
    paths:
      - site/trailer/**
      - media/demos/ASTRA-v2.mp4
      - docs/readme/trailer-v2.svg
      - .github/workflows/trailer-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trailer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare player and original video
        run: |
          mkdir -p _site
          cp site/trailer/index.html _site/index.html
          cp media/demos/ASTRA-v2.mp4 _site/ASTRA-v2.mp4
          cp docs/readme/trailer-v2.svg _site/trailer-v2.svg
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
